[workspace]
members = [".", "crates/wpg-wasm", "crates/wpg-thumb"]

[package]
name = "wpg"
version = "0.1.0"
edition = "2024"
authors = ["WPG Format Team"]
description = "Web Progressive Graphic (.wpg) - Next-Generation Image Format based on AV1 with enhanced compression"

[lib]
name = "wpg"
path = "src/lib.rs"

[[bin]]
name = "wpg"
path = "src/bin/wpg.rs"

[[bin]]
name = "wpg-enc"
path = "src/bin/wpg_enc.rs"

[[bin]]
name = "wpg-dec"
path = "src/bin/wpg_dec.rs"

[[bin]]
name = "wpg-view"
path = "src/bin/wpg_view.rs"

[dependencies]
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8"] }
ravif = { version = "0.13", default-features = false, features = ["threading"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "avif"] }
zstd = "0.13"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webp = "0.3.0"
avif-serialize = "0.8.9"

[profile.release]
opt-level = 3            # Full SIMD vectorization & loop unrolling for host codecs (rav1e, rav1d, zstd)
lto = "thin"             # Fast cross-crate Link-Time Optimization
codegen-units = 1        # Single codegen unit for maximum optimization
panic = "abort"          # Remove unwinding boilerplate
strip = true             # Strip all debug symbols and symbol tables

[profile.release.package.wpg-wasm]
opt-level = "z"

[profile.release.package.ruzstd]
opt-level = "z"

[profile.release.package.avif-serialize]
opt-level = "z"

[profile.release.package.twox-hash]
opt-level = "z"
