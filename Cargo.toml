[workspace]
members = [".", "crates/wpg-wasm", "crates/wpg-thumb"]

[package]
name = "wpg"
version = "0.1.0"
edition = "2024"
authors = ["WPG Format Team"]
description = "Web Progressive Graphic (.wpg) - Next-Generation Image Format based on AV1 with enhanced compression"

[lib]
name = "wpg"
path = "src/lib.rs"

[[bin]]
name = "wpg"
path = "src/bin/wpg.rs"

[[bin]]
name = "wpg-enc"
path = "src/bin/wpg_enc.rs"

[[bin]]
name = "wpg-dec"
path = "src/bin/wpg_dec.rs"

[[bin]]
name = "wpg-view"
path = "src/bin/wpg_view.rs"

[dependencies]
rav1e = { version = "0.7", default-features = false }
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8"] }
ravif = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "avif"] }
zstd = "0.13"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webp = "0.3.0"
avif-serialize = "0.8.9"
