name: Release & Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build Native CLI Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: wpg.exe
            archive: wpg-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: wpg
            archive: wpg-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: wpg
            archive: wpg-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}, wasm32-unknown-unknown

      - name: Build Wasm Decoder
        run: cargo build --package wpg-wasm --target wasm32-unknown-unknown --release

      - name: Copy Wasm Binary
        run: cp target/wasm32-unknown-unknown/release/wpg_wasm.wasm ./wpg-decoder.wasm
        shell: bash

      - name: Build Release CLI
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1

      - name: Package Unix
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist_unix
          for b in wpg wpg-enc wpg-dec wpg-lab; do
            if [ -f "target/${{ matrix.target }}/release/$b" ]; then
              cp "target/${{ matrix.target }}/release/$b" dist_unix/
            fi
          done
          cp wpg-decoder.wasm wpg-element.js wpg-worker.js README.md DOCUMENTATION.md SPECIFICATION.md LICENSE dist_unix/ 2>/dev/null || true
          tar -czf ${{ matrix.archive }} -C dist_unix .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wpg-*.zip
            wpg-*.tar.gz
            wpg-decoder.wasm
            wpg-element.js
            wpg-worker.js

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: build-binaries
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Wasm Decoder
        run: |
          cargo build --package wpg-wasm --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/wpg_wasm.wasm packages/wpg-img/wpg-decoder.wasm
          cp target/wasm32-unknown-unknown/release/wpg_wasm.wasm packages/wpg-img/dist/wpg-decoder.wasm

      - name: Publish wpg-img to NPM
        working-directory: packages/wpg-img
        run: npm publish --access public || echo "Package already published or token restricted"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

